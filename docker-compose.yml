version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: todo_postgres
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: todo_flask
    environment:
      DB_HOST: db
      DB_NAME: todoapp
      DB_USER: postgres
      DB_PASSWORD: password
      DB_PORT: 5432
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "
        echo '⏳ Waiting for database...' &&
        sleep 3 &&
        echo '📦 Running migrations...' &&
        flask db upgrade &&
        echo '🌱 Seeding database...' &&
        python seed_db.py &&
        echo '🚀 Starting Flask app...' &&
        python app.py
      "

volumes:
  postgres_data:
