databases:
  - name: todo-db
    databaseName: todoapp
    user: todo_user

services:
  - type: web
    name: todo-flask-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString